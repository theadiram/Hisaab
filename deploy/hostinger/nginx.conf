limit_req_zone $binary_remote_addr zone=hisaab_api:10m rate=15r/s;
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/adiram.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adiram.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name adiram.me www.adiram.me;
    client_max_body_size 25m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Hisaab-Client-IP $remote_addr;
        proxy_set_header X-Nf-Client-Connection-Ip "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=hisaab_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Hisaab-Client-IP $remote_addr;
        proxy_set_header X-Nf-Client-Connection-Ip "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name adiram.me www.adiram.me;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
